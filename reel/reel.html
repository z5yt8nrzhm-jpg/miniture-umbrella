<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mat Pilates Reel</title>
<style>
@font-face{font-family:Corm;src:url(fonts/Cormorant.ttf);font-weight:300 700;font-style:normal}
@font-face{font-family:Corm;src:url(fonts/Cormorant-Italic.ttf);font-weight:300 700;font-style:italic}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
html,body{margin:0;background:#F5F0E8}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, GROUND = 1560, GW = 1610, DURATION = 21;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const C = {
  cream: '#F5F0E8', char: '#4A4F4A', soft: '#8A877F', terra: '#B0714F',
  bldg: '#ECE4D7', bldgLine: '#D2C6B5', band: '#5C615B', icon: '#6E716B',
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const eBack = x => { x = clamp(x); const k = 1.70158; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const lerp2 = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
const inOut = (t, a, b, c2, d) => ease(seg(t, a, b)) * (1 - ease(seg(t, c2, d)));
function keys(t, kf) { // piecewise-linear [[t,v],...]
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) if (t <= kf[i][0]) {
    const [t0, v0] = kf[i - 1], [t1, v1] = kf[i];
    return lerp(v0, v1, ease((t - t0) / (t1 - t0)));
  }
  return kf[kf.length - 1][1];
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.round(clamp(f < 0 ? v * (1 + f) : v + (255 - v) * f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function text(s, x, y, o) {
  const { font, color = C.char, alpha = 1, sp = 0, align = 'center', dy = 0, maxW = 0 } = o;
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font; ctx.fillStyle = color;
  ctx.letterSpacing = sp + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (maxW) {
    const w = ctx.measureText(s).width;
    if (w > maxW) { ctx.translate(x, y + dy); ctx.scale(maxW / w, maxW / w); ctx.translate(-x, -(y + dy)); }
  }
  ctx.fillText(s, x + (align === 'center' ? sp / 2 : 0), y + dy);
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- backdrop ----------
function backdrop(t) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(540, 1250, 0, 540, 1250, 760);
  const a = (0.5 + 0.08 * Math.sin(t * 1.1)) * ease(seg(t, 0, 1.2));
  g.addColorStop(0, `rgba(250,222,166,${a})`); g.addColorStop(1, 'rgba(250,222,166,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function palm(x, h, lean, t, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;
  const tx = x + lean, ty = GROUND - h;
  ctx.strokeStyle = '#CFC3B1'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.quadraticCurveTo(x + lean * 0.2, GROUND - h * 0.5, tx, ty); ctx.stroke();
  ctx.fillStyle = '#CDBFAB';
  const angs = [-2.9, -2.45, -2.0, -1.55, -1.1, -0.65, -0.2];
  angs.forEach((a0, k) => {
    const a = a0 + 0.05 * Math.sin(t * 1.3 + k + x);
    const L = 105 - Math.abs(a0 + 1.55) * 8;
    const ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L + 38;
    const mx = tx + Math.cos(a) * L * 0.55, my = ty + Math.sin(a) * L * 0.55 - 6;
    const nx = -Math.sin(a) * 9, ny = Math.cos(a) * 9;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(mx + nx, my + ny, ex, ey);
    ctx.quadraticCurveTo(mx - nx, my - ny, tx, ty);
    ctx.fill();
  });
  ctx.restore();
}

function tower(alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.strokeStyle = '#C9BEAD'; ctx.lineWidth = 4; ctx.fillStyle = C.bldg;
  const cx = 880;
  [[818, 1146, 792, GROUND], [942, 1146, 968, GROUND], [858, 1146, 852, GROUND], [902, 1146, 908, GROUND]]
    .forEach(([a, b, c2, d]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c2, d); ctx.stroke(); });
  ctx.lineWidth = 2.5;
  for (let y = 1180; y < GROUND - 20; y += 85) {
    const k = (y - 1146) / (GROUND - 1146), xl = lerp(818, 792, k), xr = lerp(942, 968, k);
    const k2 = (y + 85 - 1146) / (GROUND - 1146), xl2 = lerp(818, 792, k2), xr2 = lerp(942, 968, k2);
    ctx.beginPath(); ctx.moveTo(xl, y); ctx.lineTo(xr2, y + 85); ctx.moveTo(xr, y); ctx.lineTo(xl2, y + 85);
    ctx.moveTo(xl, y); ctx.lineTo(xr, y); ctx.stroke();
  }
  ctx.lineWidth = 4;
  rr(800, 1030, 160, 112, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(792, 1032); ctx.lineTo(cx, 984); ctx.lineTo(968, 1032); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 984); ctx.lineTo(cx, 962); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, 958, 6, 0, 7); ctx.stroke();
  rr(790, 1142, 180, 10, 3); ctx.fill(); ctx.stroke();
  text('GILBERT', cx, 1100, { font: '600 30px Corm', color: '#B3A897', sp: 3 });
  ctx.restore();
}

const BLD = [[30, 160, 300, 'court'], [196, 112, 190, 'shop'], [312, 132, 236, 'step'], [448, 118, 180, 'shop'],
  [570, 140, 246, 'step'], [714, 104, 196, 'shop'], [822, 150, 168, 'shop'], [976, 110, 214, 'step']];
function building(x, w, h, type) {
  const y = GROUND - h;
  ctx.fillStyle = C.bldg; ctx.strokeStyle = C.bldgLine; ctx.lineWidth = 3;
  if (type === 'court') {
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x + w / 2, y - 58); ctx.lineTo(x + w + 10, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + w / 2, y - 22, 11, 0, 7); ctx.stroke();
  }
  if (type === 'step') { ctx.beginPath(); ctx.rect(x + w * 0.25, y - 26, w * 0.5, 26); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  if (type === 'court') {
    for (let i = 0; i < 4; i++) { const cx = x + 26 + i * (w - 52) / 3; ctx.beginPath(); ctx.moveTo(cx, y + 26); ctx.lineTo(cx, GROUND - 8); ctx.stroke(); }
    return;
  }
  ctx.beginPath(); ctx.moveTo(x - 6, y + 14); ctx.lineTo(x + w + 6, y + 14); ctx.stroke();
  const n = Math.max(2, Math.round(w / 46)), cell = (w - 24) / n;
  for (let i = 0; i < n; i++) ctx.strokeRect(x + 12 + i * cell + 5, y + 34, cell - 10, 38);
  ctx.strokeRect(x + 12, GROUND - 86, w - 24, 78);
  ctx.beginPath(); ctx.moveTo(x + 4, GROUND - 96); ctx.lineTo(x + w - 4, GROUND - 96); ctx.stroke();
}

const LP = [[-20, 950], [540, 1130], [1100, 950]];
function bez(u) { const [a, b, d] = LP; const m = 1 - u; return [m * m * a[0] + 2 * m * u * b[0] + u * u * d[0], m * m * a[1] + 2 * m * u * b[1] + u * u * d[1]]; }
const N_BULBS = 19;
function lights(t, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.strokeStyle = '#BDB2A2'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(...LP[0]); ctx.quadraticCurveTo(...LP[1], ...LP[2]); ctx.stroke();
  for (let i = 0; i < N_BULBS; i++) {
    const [x, y] = bez((i + 0.5) / N_BULBS);
    const on = ease(seg(t, 0.4 + i * 0.07, 0.55 + i * 0.07));
    const fl = 0.85 + 0.15 * Math.sin(t * 3.1 + i * 1.7);
    if (on > 0) {
      const g = ctx.createRadialGradient(x, y + 10, 0, x, y + 10, 40);
      g.addColorStop(0, `rgba(255,208,110,${0.6 * on * fl})`); g.addColorStop(1, 'rgba(255,208,110,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 40, y - 30, 80, 80);
    }
    ctx.strokeStyle = '#BDB2A2'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 4); ctx.stroke();
    ctx.fillStyle = on > 0.5 ? '#F6CF73' : '#E4DBCC';
    ctx.beginPath(); ctx.ellipse(x, y + 11, 7, 9, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function floor() {
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, '#EEE6D9'); g.addColorStop(1, '#E6DCCB');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#D9CDBB'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
}

// ---------- cast ----------
const WOMEN = [
  { x: 220, skin: '#F1D1B8', hair: '#C9A26B', style: 'bun', top: '#9DAE95', bot: '#4A4F4A', prop: 'tumbler', pc: '#F2B8A8', side: 1, ph: 0.0 },
  { x: 432, skin: '#8D5A3E', hair: '#1E1715', style: 'long', top: '#E6D7C1', bot: '#6B5A4C', prop: 'can', pc: '#C27B5B', side: 1, ph: 1.3 },
  { x: 650, skin: '#E3B48F', hair: '#3B2A22', style: 'bob', top: '#C27B5B', bot: '#3E3A36', prop: 'tumbler', pc: '#B9D3C9', side: -1, ph: 2.1 },
  { x: 864, skin: '#C68E6B', hair: '#5A3A28', style: 'pony', top: '#D8BE9C', bot: '#5E665D', prop: 'can', pc: '#8FA58A', side: -1, ph: 0.7 },
];
const CAN_OPEN = [null, 2.3, null, 2.75];
const DROP = 11.2, DROP_END = 11.75;

const SCHED = [[0, 'rest'], [3.55, 'cheers'], [4.7, 'rest'], [12.05, 'up'], [12.85, 'up'], [13.6, 'connect'], [14.35, 'heart'], [15.25, 'rest']];
const SCHED0 = [[0, 'rest'], [3.55, 'cheers'], [4.7, 'rest'], [5.05, 'sip'], [5.95, 'rest'], [12.05, 'up'], [12.85, 'up'], [13.6, 'connect'], [14.35, 'heart'], [15.25, 'rest']];

function poseFn(name, i, t) {
  const w = WOMEN[i], s = w.side, held = t < DROP;
  const rest = held ? { in: [s * 34, -255], out: [-s * 70, -196] } : { in: [s * 70, -196], out: [-s * 70, -196] };
  switch (name) {
    case 'rest': return rest;
    case 'cheers':
      if (i === 1) return { in: [540 - w.x - 26, -440], out: rest.out };
      if (i === 2) return { in: [540 - w.x + 26, -440], out: rest.out };
      return { in: [s * 64, -455], out: rest.out };
    case 'sip': return { in: [s * 8, -306], out: rest.out };
    case 'up': return { in: [s * 34, -530], out: [-s * 34, -530] };
    case 'connect': {
      const R = i < 3 ? [(WOMEN[i + 1].x - w.x) / 2, -238] : [70, -196];
      const L = i > 0 ? [-(w.x - WOMEN[i - 1].x) / 2, -238] : [-70, -196];
      return s > 0 ? { in: R, out: L } : { in: L, out: R };
    }
    case 'heart': return { in: [s * 16, -318], out: [-s * 16, -318] };
  }
}
function hands(i, t) {
  const sch = i === 0 ? SCHED0 : SCHED;
  let k = 0; for (let j = 0; j < sch.length; j++) if (t >= sch[j][0]) k = j;
  let cur = poseFn(sch[k][1], i, t);
  if (k > 0) {
    const p = ease((t - sch[k][0]) / 0.45);
    const prev = poseFn(sch[k - 1][1], i, Math.min(t, sch[k][0] - 0.001));
    cur = { in: lerp2(prev.in, cur.in, p), out: lerp2(prev.out, cur.out, p) };
  }
  // a little jolt when the can cracks open
  if (CAN_OPEN[i] !== null) { const j = Math.exp(-Math.pow((t - CAN_OPEN[i] - 0.05) / 0.08, 2)); cur.in = [cur.in[0], cur.in[1] - 14 * j]; }
  return cur;
}
function laughAt(i, t) {
  let v = keys(t, [[0, 0.1], [1.8, 0.15], [2.4, 0.6], [3.9, 0.6], [4.3, 1], [6.2, 1], [7, 0.4], [11.8, 0.35], [12.2, 0.15], [14.2, 0.2], [14.5, 0.95], [15.3, 0.85], [16.3, 0.55]]);
  if (i === 0) v *= 1 - inOut(t, 5.0, 5.2, 5.8, 6.0);
  return v;
}
function leanAt(i, t) {
  const b = inOut(t, 12.85, 13.0, 13.45, 13.6) * 0.075 * Math.sin((t - 12.85) / 0.75 * Math.PI * 2);
  return b + 0.012 * Math.sin(t * 1.4 + WOMEN[i].ph);
}

function ik(sx, sy, tx, ty, a, b, outDir) {
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy);
  const maxd = a + b - 0.5;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const e1 = [sx + Math.cos(ang + A) * a, sy + Math.sin(ang + A) * a];
  const e2 = [sx + Math.cos(ang - A) * a, sy + Math.sin(ang - A) * a];
  // reaching across or down: elbow drops; reaching up: elbow flares outward
  const score = e => ty > sy - 40 ? (e[1] - sy) + (e[0] - sx) * outDir * 0.2 : (e[0] - sx) * outDir;
  const elbow = score(e1) > score(e2) ? e1 : e2;
  return [elbow, [sx + dx, sy + dy]];
}

function tumbler(col, side, t) {
  ctx.fillStyle = col; ctx.strokeStyle = 'rgba(60,40,30,0.18)'; ctx.lineWidth = 2;
  // handle
  ctx.save(); ctx.strokeStyle = shade(col, -0.12); ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(side * 24, -46); ctx.bezierCurveTo(side * 52, -40, side * 52, 14, side * 21, 20); ctx.stroke(); ctx.restore();
  // straw
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(60,40,30,0.25)'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(side * -2, -80); ctx.lineTo(side * -10, -124); ctx.stroke();
  ctx.strokeStyle = '#FBF8F2'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
  // body
  ctx.beginPath(); ctx.moveTo(-26, -70); ctx.lineTo(26, -70); ctx.lineTo(19, 50); ctx.quadraticCurveTo(0, 56, -19, 50); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(col, -0.1); ctx.beginPath(); ctx.moveTo(-21.5, 18); ctx.lineTo(21.5, 18); ctx.lineTo(19, 50); ctx.quadraticCurveTo(0, 56, -19, 50); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-16, -60, 6, 70);
  // lid
  ctx.fillStyle = shade(col, 0.55); rr(-29, -84, 58, 16, 6); ctx.fill(); ctx.stroke();
}
function can(col, opened, t) {
  ctx.fillStyle = '#F3EEE6'; ctx.strokeStyle = '#CFC5B6'; ctx.lineWidth = 2;
  rr(-19, -58, 38, 104, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col; ctx.fillRect(-19, -28, 38, 44);
  text('fizz', 0, 2, { font: 'italic 600 20px Corm', color: '#FFFFFF' });
  ctx.fillStyle = '#D9D5CE'; ctx.beginPath(); ctx.ellipse(0, -56, 16, 4, 0, 0, 7); ctx.fill();
  if (!opened) { ctx.fillStyle = '#BDB7AD'; ctx.fillRect(-4, -59, 8, 3); }
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(-12 + rnd(k) * 24, -50 + rnd(k + 9) * 90, 1.6, 0, 7); ctx.fill(); }
}
function fizz(i, t, x, y) {
  const t0 = CAN_OPEN[i]; if (t0 === null || t < t0) return;
  const dt = t - t0;
  ctx.save();
  // opening burst
  for (let k = 0; k < 22; k++) {
    const life = 0.5 + rnd(k + i * 50) * 0.6, p = dt / life; if (p > 1) continue;
    const a = -Math.PI / 2 + (rnd(k * 3 + i) - 0.5) * 1.4, sp = 80 + rnd(k * 7) * 140;
    const bx = x + Math.cos(a) * sp * p, by = y - 60 + Math.sin(a) * sp * p + 60 * p * p;
    ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - p)})`; ctx.strokeStyle = `rgba(176,113,79,${0.5 * (1 - p)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 3 + rnd(k) * 4, 0, 7); ctx.fill(); ctx.stroke();
  }
  // lazy bubbles while the can is in hand
  if (t < DROP) for (let k = 0; k < 6; k++) {
    const p = ((t * 0.9 + rnd(k + 20)) % 1);
    const bx = x + Math.sin(k * 3 + t * 4) * 6, by = y - 62 - p * 70;
    ctx.strokeStyle = `rgba(176,113,79,${0.45 * (1 - p) * ease(dt / 0.6)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 2 + rnd(k) * 2.5, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function drawWoman(i, t) {
  const w = WOMEN[i], s = w.side;
  const delay = [0.5, 0.75, 0.62, 0.88][i];
  const pin = eOut(seg(t, delay, delay + 1.35));
  const dx = (1 - pin) * (i < 2 ? -720 : 720);
  const walk = (1 - pin) * Math.abs(Math.sin(t * 11 + i)) * 12;
  const L = laughAt(i, t);
  const bounce = -L * Math.abs(Math.sin(t * 9 + w.ph)) * 7 - walk;
  const tilt = L * (0.09 * Math.sin(t * 4.6 + w.ph) - 0.03 * s);
  const mouth = L * (0.5 + 0.5 * Math.abs(Math.sin(t * 9 + w.ph)));
  const sipping = i === 0 && t > 5.15 && t < 5.85;
  const hp = hands(i, t);
  const hR = s > 0 ? hp.in : hp.out, hL = s > 0 ? hp.out : hp.in;

  ctx.save();
  ctx.translate(w.x + dx, GW);
  ctx.fillStyle = 'rgba(120,96,70,0.14)'; ctx.beginPath(); ctx.ellipse(0, 2, 64, 11, 0, 0, 7); ctx.fill();
  ctx.translate(0, bounce);
  ctx.rotate(leanAt(i, t));

  const headT = () => { ctx.translate(0, -395); ctx.rotate(tilt); ctx.translate(0, 395); };

  // back hair
  ctx.save(); headT(); ctx.fillStyle = w.hair;
  if (w.style === 'long') { rr(-52, -486, 104, 166, [50, 50, 26, 26]); ctx.fill(); }
  if (w.style === 'bob') { rr(-52, -486, 104, 88, [50, 50, 22, 22]); ctx.fill(); }
  if (w.style === 'pony') {
    ctx.save(); ctx.translate(36, -480); ctx.rotate(0.35 + 0.18 * Math.sin(t * 7 + w.ph) * (0.3 + L));
    ctx.beginPath(); ctx.ellipse(10, 52, 17, 58, -0.15, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.restore();

  // legs + shoes
  ctx.fillStyle = w.bot;
  ctx.beginPath(); ctx.moveTo(-50, -252); ctx.lineTo(-4, -252); ctx.lineTo(-10, -14); ctx.lineTo(-36, -14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(50, -252); ctx.lineTo(4, -252); ctx.lineTo(10, -14); ctx.lineTo(36, -14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = w.skin; ctx.fillRect(-35, -20, 24, 8); ctx.fillRect(11, -20, 24, 8);
  ctx.fillStyle = '#F8F4ED'; ctx.strokeStyle = '#D8CFC2'; ctx.lineWidth = 2;
  [[-25, -6], [25, -6]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 23, 11, 0, 0, 7); ctx.fill(); ctx.stroke(); });

  // torso
  ctx.fillStyle = w.top; ctx.strokeStyle = 'rgba(60,40,30,0.12)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-58, -350); ctx.quadraticCurveTo(-60, -372, -36, -374); ctx.lineTo(36, -374); ctx.quadraticCurveTo(60, -372, 58, -350);
  ctx.quadraticCurveTo(46, -300, 52, -244); ctx.lineTo(-52, -244); ctx.quadraticCurveTo(-46, -300, -58, -350); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(w.bot, -0.1); rr(-53, -258, 106, 16, 4); ctx.fill();
  // neckline
  ctx.fillStyle = w.skin; ctx.beginPath(); ctx.moveTo(-20, -374); ctx.quadraticCurveTo(0, -350, 20, -374); ctx.closePath(); ctx.fill();
  ctx.fillRect(-13, -400, 26, 28);

  // head
  ctx.save(); headT();
  ctx.fillStyle = w.skin;
  ctx.beginPath(); ctx.arc(-40, -438, 8, 0, 7); ctx.arc(40, -438, 8, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -440, 40, 46, 0, 0, 7); ctx.fill();
  // face
  ctx.strokeStyle = '#3A2E2A'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (L > 0.2 || sipping) {
    [-15, 15].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -440, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); });
  } else {
    ctx.fillStyle = '#3A2E2A'; [-15, 15].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -444, 4.5, 0, 7); ctx.fill(); });
  }
  ctx.fillStyle = 'rgba(226,120,108,0.28)';
  ctx.beginPath(); ctx.arc(-25, -424, 9, 0, 7); ctx.arc(25, -424, 9, 0, 7); ctx.fill();
  if (sipping) {
    ctx.fillStyle = '#7A3B32'; ctx.beginPath(); ctx.ellipse(0, -417, 5, 6, 0, 0, 7); ctx.fill();
  } else if (mouth > 0.15) {
    const o = 4 + mouth * 16;
    ctx.fillStyle = '#7A3B32'; ctx.beginPath(); ctx.moveTo(-15, -423); ctx.quadraticCurveTo(0, -423 + o * 1.9, 15, -423); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(-12, -423); ctx.lineTo(12, -423); ctx.lineTo(10, -419); ctx.lineTo(-10, -419); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -428, 11, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  // hair cap
  ctx.fillStyle = w.hair;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-70, -540); ctx.lineTo(70, -540); ctx.lineTo(70, -446);
  ctx.quadraticCurveTo(26, -472, 6 * s, -464); ctx.quadraticCurveTo(-34, -460, -70, -436); ctx.closePath(); ctx.clip();
  ctx.beginPath(); ctx.ellipse(0, -446, 44, 50, 0, 0, 7); ctx.fill();
  ctx.restore();
  if (w.style === 'long' || w.style === 'bob') { rr(-47, -462, 14, w.style === 'long' ? 74 : 58, 7); ctx.fill(); rr(33, -462, 14, w.style === 'long' ? 74 : 58, 7); ctx.fill(); }
  if (w.style === 'bun') { ctx.beginPath(); ctx.arc(0, -500, 24, 0, 7); ctx.fill(); ctx.fillStyle = shade(w.top, -0.15); rr(-14, -481, 28, 7, 3); ctx.fill(); }
  if (w.style === 'pony') { ctx.fillStyle = shade(w.pc, -0.1); ctx.beginPath(); ctx.arc(38, -478, 7, 0, 7); ctx.fill(); }
  // laugh lines
  const lm = clamp((L - 0.55) / 0.4) * (0.6 + 0.4 * Math.sin(t * 9 + w.ph));
  if (lm > 0 && !sipping) {
    ctx.strokeStyle = `rgba(176,113,79,${lm})`; ctx.lineWidth = 4;
    [[-1], [1]].forEach(([d]) => {
      ctx.beginPath(); ctx.moveTo(d * 62, -476); ctx.lineTo(d * 76, -490);
      ctx.moveTo(d * 66, -452); ctx.lineTo(d * 84, -456); ctx.stroke();
    });
  }
  ctx.restore();

  // prop
  const sh = { R: [50, -358], L: [-50, -358] };
  const inHand = s > 0 ? hR : hL;
  let pp, held = t < DROP;
  if (held) pp = inHand;
  else {
    const p = ease(seg(t, DROP, DROP_END));
    const start = poseFn('rest', i, DROP - 0.01).in, end = [-s * 100, -60];
    pp = lerp2(start, end, p); pp[1] -= Math.sin(p * Math.PI) * 50;
  }
  ctx.save(); ctx.translate(pp[0], pp[1]);
  if (!held) ctx.translate(0, -bounce * (1 - 0));
  if (w.prop === 'tumbler') tumbler(w.pc, s, t); else can(w.pc, CAN_OPEN[i] !== null && t >= CAN_OPEN[i], t);
  ctx.restore();
  if (w.prop === 'can') fizz(i, t, pp[0], pp[1]);

  // arms
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [['L', hL, -1], ['R', hR, 1]].forEach(([k, hnd, od]) => {
    const [el, hd] = ik(sh[k][0], sh[k][1], hnd[0], hnd[1], 92, 90, od);
    ctx.strokeStyle = w.skin; ctx.lineWidth = 21;
    ctx.beginPath(); ctx.moveTo(...sh[k]); ctx.lineTo(...el); ctx.lineTo(...hd); ctx.stroke();
    ctx.fillStyle = w.top; ctx.beginPath(); ctx.arc(sh[k][0] - od * 2, sh[k][1] + 4, 17, 0, 7); ctx.fill();
    ctx.fillStyle = w.skin; ctx.beginPath(); ctx.arc(hd[0], hd[1], 13, 0, 7); ctx.fill();
  });
  ctx.restore();
}

// ---------- mats ----------
const MAT = [['#8D918A', '#B97C5C'], ['#A9B7A2', '#EFE6D6'], ['#D9A47F', '#8FA58A'], ['#9EA39B', '#E3C7A6']];
function mats(t) {
  const a = 1 - ease(seg(t, 15.2, 15.8));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  WOMEN.forEach((w, i) => {
    const p = eOut(seg(t, 7.0 + i * 0.12, 7.75 + i * 0.12)); if (p <= 0) return;
    const y0 = 1652, y1 = lerp(y0, 1856, p);
    const hw = y => lerp(80, 112, (y - 1652) / 204);
    ctx.fillStyle = MAT[i][0];
    ctx.beginPath(); ctx.moveTo(w.x - hw(y0), y0); ctx.lineTo(w.x + hw(y0), y0); ctx.lineTo(w.x + hw(y1), y1); ctx.lineTo(w.x - hw(y1), y1); ctx.closePath(); ctx.fill();
    if (p < 1) { ctx.fillStyle = shade(MAT[i][0], -0.15); rr(w.x - hw(y1) - 4, y1 - 14, hw(y1) * 2 + 8, 28 * (1 - p) + 10, 12); ctx.fill(); }
    const q = eBack(seg(t, 8.0 + i * 0.1, 8.4 + i * 0.1));
    if (q > 0) {
      ctx.save(); ctx.translate(w.x, 1716); ctx.scale(q, q);
      ctx.fillStyle = shade(MAT[i][1], -0.18); ctx.beginPath(); ctx.ellipse(0, 12, 54, 20, 0, 0, 7); ctx.fill();
      ctx.fillRect(-54, 0, 108, 12);
      ctx.fillStyle = MAT[i][1]; ctx.beginPath(); ctx.ellipse(0, 0, 54, 20, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 32, 11, 0, 0, 7); ctx.stroke();
      ctx.restore();
    }
  });
  ctx.restore();
}

// ---------- sparkles + hearts ----------
function sparkle(x, y, t, t0, col = '#E2B04A', size = 46) {
  const p = seg(t, t0, t0 + 0.6); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha *= 1 - p; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, r0 = size * 0.3 + size * p, r1 = r0 + (k % 2 ? 10 : 22) * (1 - p);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.0, y - s * 0.3, x - s * 0.45, y - s * 0.95, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 0.95, x + s * 1.0, y - s * 0.3, x, y + s * 0.35);
}
function hearts(t) {
  WOMEN.forEach((w, i) => {
    for (let k = 0; k < 2; k++) {
      const t0 = 14.45 + i * 0.12 + k * 0.35, p = seg(t, t0, t0 + 1.5); if (p <= 0 || p >= 1) continue;
      const x = w.x + (k ? 36 : -30) + Math.sin(p * 6 + i) * 10, y = GW - 520 - p * 170;
      ctx.save(); ctx.globalAlpha *= Math.sin(p * Math.PI); ctx.fillStyle = k ? '#D98C7A' : '#C27B5B';
      heartPath(x, y, 20 + 6 * k); ctx.fill(); ctx.restore();
    }
  });
}

// ---------- icons ----------
function iconRing(x, y, a) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.icon; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 38, 0, 7); ctx.stroke(); ctx.restore(); }
function icon(kind, x, y, a, r = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(r, r);
  ctx.strokeStyle = C.icon; ctx.fillStyle = C.icon; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'cal') { rr(-17, -14, 34, 30, 4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-17, -4); ctx.lineTo(17, -4); ctx.moveTo(-8, -20); ctx.lineTo(-8, -10); ctx.moveTo(8, -20); ctx.lineTo(8, -10); ctx.stroke(); }
  if (kind === 'clock') { ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.moveTo(0, -10); ctx.lineTo(0, 0); ctx.lineTo(8, 6); ctx.stroke(); }
  if (kind === 'pin') { ctx.beginPath(); ctx.moveTo(0, 20); ctx.bezierCurveTo(-24, -4, -16, -22, 0, -22); ctx.bezierCurveTo(16, -22, 24, -4, 0, 20); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -6, 6, 0, 7); ctx.stroke(); }
  if (kind === 'ticket') { ctx.beginPath(); ctx.moveTo(-20, -12); ctx.lineTo(20, -12); ctx.lineTo(20, -4); ctx.arc(20, 0, 4, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(20, 12); ctx.lineTo(-20, 12); ctx.lineTo(-20, 4); ctx.arc(-20, 0, 4, Math.PI / 2, -Math.PI / 2, true); ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-6, 12); ctx.setLineDash([3, 4]); ctx.stroke(); }
  if (kind === 'lotus') lotusShape(0, 4, 1);
  if (kind === 'wind') { ctx.beginPath(); ctx.moveTo(-20, -8); ctx.lineTo(8, -8); ctx.arc(8, -14, 6, Math.PI / 2, -Math.PI * 0.9, true); ctx.moveTo(-20, 2); ctx.lineTo(14, 2); ctx.moveTo(-20, 12); ctx.lineTo(4, 12); ctx.arc(4, 18, 6, -Math.PI / 2, Math.PI * 0.9); ctx.stroke(); }
  if (kind === 'people') { [[-9, 0], [11, 0]].forEach(([px]) => { ctx.beginPath(); ctx.arc(px, -9, 7, 0, 7); ctx.moveTo(px - 13, 18); ctx.quadraticCurveTo(px, -4, px + 13, 18); ctx.stroke(); }); }
  if (kind === 'heart') { heartPath(0, 2, 22); ctx.stroke(); }
  ctx.restore();
}
function lotusShape(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const petal = (rot, h, wd) => { ctx.save(); ctx.rotate(rot); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-wd, -h * 0.55, 0, -h); ctx.quadraticCurveTo(wd, -h * 0.55, 0, 0); ctx.stroke(); ctx.restore(); };
  petal(0, 24, 9); petal(-0.55, 20, 8); petal(0.55, 20, 8); petal(-1.1, 15, 6); petal(1.1, 15, 6);
  ctx.beginPath(); ctx.moveTo(-22, 2); ctx.quadraticCurveTo(0, 8, 22, 2); ctx.stroke();
  ctx.restore();
}

// ---------- text scenes ----------
function scene1Text(t) {
  const out = 1 - ease(seg(t, 6.3, 6.8));
  const a1 = ease(seg(t, 0.8, 1.4)) * out, a2 = ease(seg(t, 1.1, 1.8)) * out;
  text('TUESDAY  ·  OCTOBER 27', 540, 300, { font: '600 34px Mont', color: C.terra, sp: 8, alpha: a1, dy: (1 - a1) * 24 });
  text('grab the girls.', 540, 480, { font: 'italic 500 156px Corm', alpha: a2, dy: (1 - a2) * 30 });
  const a3 = ease(seg(t, 2.35, 2.9)) * out, a4 = ease(seg(t, 3.9, 4.45)) * out;
  text('bring the fizzy tea', 540, 610, { font: 'italic 500 80px Corm', color: C.terra, alpha: a3, dy: (1 - a3) * 20 });
  text('& your favorite cup.', 540, 705, { font: 'italic 500 80px Corm', color: C.terra, alpha: a4, dy: (1 - a4) * 20 });
}
function scene2Text(t) {
  const out = 1 - ease(seg(t, 11.4, 11.9));
  const al = ease(seg(t, 7.0, 7.7)) * out;
  ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = '#7D8178'; ctx.lineWidth = 3;
  lotusShape(540, 262, 1.5 * eBack(seg(t, 7.0, 7.6)));
  const lw = 170 * ease(seg(t, 7.2, 7.9));
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(470, 262); ctx.lineTo(470 - lw, 262); ctx.moveTo(610, 262); ctx.lineTo(610 + lw, 262); ctx.stroke();
  ctx.restore();
  const a1 = ease(seg(t, 7.3, 8.0)) * out, a2 = ease(seg(t, 7.6, 8.3)) * out, a3 = ease(seg(t, 8.3, 8.9)) * out, a4 = ease(seg(t, 8.8, 9.4)) * out;
  text('mat', 540, 470, { font: 'italic 500 260px Corm', alpha: a1, dy: (1 - a1) * 30 });
  text('PILATES', 540, 650, { font: '300 136px Mont', sp: 26, alpha: a2, dy: (1 - a2) * 30 });
  text('A VIBE COMMUNITY EXPERIENCE', 540, 745, { font: '600 31px Mont', color: C.terra, sp: 8, alpha: a3 });
  text('+ feel the energy.', 540, 865, { font: 'italic 500 92px Corm', color: C.terra, alpha: a4, dy: (1 - a4) * 20 });
}
const PILLARS = [['MOVE', 'lotus', 12.15], ['BREATHE', 'wind', 12.9], ['CONNECT', 'people', 13.65], ['FEEL GOOD', 'heart', 14.4]];
function scene3Text(t) {
  const out = 1 - ease(seg(t, 15.0, 15.4));
  PILLARS.forEach(([word, ic, t0], k) => {
    const a = ease(seg(t, t0, t0 + 0.5)) * out, y = 300 + k * 160, dx = (1 - a) * -40;
    iconRing(250 + dx, y - 26, a); icon(ic, 250 + dx, y - 26, a, 1.3);
    text(word, 330 + dx, y, { font: '500 74px Mont', sp: 14, align: 'left', alpha: a });
  });
}
const DETAILS = [['cal', 'TUESDAY', 'October 27'], ['clock', 'TIME', '5:00 – 5:45 pm'], ['pin', 'WHERE', 'Gilbert Flex Studio'], ['ticket', 'PRICE', '$15 · all levels']];
const LOGO = new Image(); LOGO.src = 'logo.png';
function scene4(t) {
  if (t < 15.3) return;
  // logo + partner
  const al = eBack(seg(t, 15.4, 16.0)), aa = ease(seg(t, 15.4, 15.9));
  ctx.save(); ctx.globalAlpha = aa; ctx.translate(300, 230); ctx.scale(al, al);
  ctx.beginPath(); ctx.arc(0, 0, 112, 0, 7); ctx.fillStyle = '#F2EEE7'; ctx.fill(); ctx.clip();
  ctx.drawImage(LOGO, -118, -116, 236, 236); ctx.restore();
  ctx.save(); ctx.globalAlpha = aa; ctx.strokeStyle = '#BDB5A8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(300, 230, 112, 0, 7); ctx.stroke(); ctx.restore();
  const ap = ease(seg(t, 15.7, 16.3));
  ctx.save(); ctx.globalAlpha = ap; ctx.strokeStyle = '#BDB5A8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(445, 232); ctx.lineTo(445 + 80 * ap, 232); ctx.stroke(); ctx.restore();
  text('partnering with', 770, 200, { font: 'italic 500 54px Corm', color: C.soft, alpha: ap });
  text('VIBE', 770, 300, { font: '400 96px Mont', sp: 30, alpha: ap, dy: (1 - ap) * 16 });
  // rules + rows
  const ar = ease(seg(t, 16.0, 16.6));
  ctx.save(); ctx.globalAlpha = ar; ctx.strokeStyle = '#CFC6B8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(540 - 420 * ar, 400); ctx.lineTo(540 + 420 * ar, 400); ctx.moveTo(540 - 420 * ar, 872); ctx.lineTo(540 + 420 * ar, 872); ctx.stroke(); ctx.restore();
  DETAILS.forEach(([ic, k, v], j) => {
    const a = ease(seg(t, 16.2 + j * 0.2, 16.7 + j * 0.2)), top = 440 + j * 108, dx = (1 - a) * -36;
    iconRing(220 + dx, top + 44, a); icon(ic, 220 + dx, top + 44, a, 1.05);
    text(k, 292 + dx, top + 26, { font: '600 24px Mont', color: C.soft, sp: 7, align: 'left', alpha: a });
    text(v, 290 + dx, top + 80, { font: '600 58px Corm', align: 'left', alpha: a });
  });
  // CTA
  const ac = ease(seg(t, 17.2, 17.7));
  if (ac > 0) {
    const pulse = 1 + 0.04 * Math.sin((t - 17.7) * Math.PI * 2 / 1.3) * ease(seg(t, 17.7, 18.1));
    const pw = 780 * pulse, ph = 120 * pulse, y = 1712 + (1 - ac) * 40;
    ctx.save(); ctx.globalAlpha = ac;
    ctx.fillStyle = 'rgba(70,60,50,0.18)'; rr(540 - pw / 2, y - ph / 2 + 8, pw, ph, ph / 2); ctx.fill();
    ctx.fillStyle = C.band; rr(540 - pw / 2, y - ph / 2, pw, ph, ph / 2); ctx.fill();
    ctx.restore();
    text('save your spot · link in bio', 540, y + 16 * pulse, { font: `500 ${Math.round(46 * pulse)}px Mont`, color: C.cream, alpha: ac });
  }
  // footer band
  const af = eOut(seg(t, 15.6, 16.2));
  if (af > 0) {
    ctx.fillStyle = C.band; ctx.fillRect(0, H - 76 * af, W, 76);
    text('MATS PROVIDED  ·  COMFY CLOTHES  ·  BEGINNER FRIENDLY', 540, H - 76 * af + 47, { font: '600 23px Mont', color: C.cream, sp: 4, maxW: 1000 });
  }
}

// ---------- frame ----------
function render(t) {
  ctx.save();
  backdrop(t);
  const sa = ease(seg(t, 0, 0.7));
  const rise = (1 - eOut(seg(t, 0, 1.0))) * 40;
  ctx.save(); ctx.translate(0, rise); ctx.globalAlpha = sa;
  palm(118, 390, -14, t, 1); palm(236, 300, 10, t, 1); palm(1012, 340, -12, t, 1);
  tower(1);
  BLD.forEach(b => building(...b));
  ctx.restore();
  lights(t, sa);
  floor();
  mats(t);
  WOMEN.forEach((_, i) => drawWoman(i, t));
  sparkle(540, 1105, t, 4.02);
  sparkle(540, 1105, t, 4.12, '#C27B5B', 30);
  hearts(t);
  scene1Text(t); scene2Text(t); scene3Text(t); scene4(t);
  ctx.restore();
}

window.render = render;
window.DURATION = DURATION;
Promise.all([
  document.fonts.load('italic 500 100px Corm'), document.fonts.load('600 100px Corm'),
  document.fonts.load('300 100px Mont'), document.fonts.load('600 100px Mont'),
  new Promise(r => { if (LOGO.complete) r(); else LOGO.onload = r; }),
]).then(() => { render(0); window.ready = true; });

// live preview when opened directly
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { if (window.ready) render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
