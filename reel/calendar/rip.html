<!doctype html>
<html><head><meta charset="utf-8"><title>Gilbert Flex Calendar Rip</title>
<style>
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Lora;src:url(fonts/Lora.ttf);font-weight:400 700;font-style:normal}
@font-face{font-family:Lora;src:url(fonts/Lora-Italic.ttf);font-weight:400 700;font-style:italic}
html,body{margin:0;background:#F6F3EC}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Calendar reel: a hand rips October off, November's city goes dark, family dinner, "save your spot" flickers on.
const W = 1080, H = 1920, DURATION = 11;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const C = { bg: '#F6F3EC', page: '#FBF8F1', char: '#3E443E', band: '#5D625B', terra: '#A8714F', sage: '#8F9C88',
  soft: '#7A7E77', dim: '#CFC8BC', bldg: '#E2DED6', line: '#CFCAC1', win: '#D9D4CB', lit: '#F4CF86' };
const PX = 150, PY = 780, PW = 780, PH = 830, TEAR = 40;
const PHOTO = { x: 20, y: 52, w: 740, h: 260 };

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const eIn = x => { x = clamp(x); return x * x * x; };
const lerp = (a, b, p) => a + (b - a) * p;
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(g, s, x, y, font, color, { sp = 0, align = 'center', alpha = 1 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.letterSpacing = sp + 'px'; g.textAlign = align;
  g.fillText(s, x + (align === 'center' ? sp / 2 : 0), y); g.restore();
}
function canvas(w, h) { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; }

// ---------- city pieces ----------
function layout(seed, width, minH, maxH) {
  const out = []; let x = -20, i = 0;
  while (x < width + 20) {
    const w = 64 + rnd(seed + i * 3) * 76;
    const h = minH + (maxH - minH) * Math.pow(rnd(seed + i * 7 + 1), 0.9);
    out.push({ x, w, h, type: ['flat', 'step', 'dome', 'spire', 'flat', 'step'][Math.floor(rnd(seed + i * 5 + 2) * 6)], i: seed * 100 + i });
    x += w - 2; i++;
  }
  return out;
}
function drawCity(g, L, base, o) {
  for (const b of L) {
    const { x, w, h } = b, y = base - h;
    g.fillStyle = o.fill; g.strokeStyle = o.line; g.lineWidth = o.lw || 2;
    if (b.type === 'step') { g.beginPath(); g.rect(x + w * 0.22, y - 24, w * 0.56, 24); g.fill(); g.stroke(); }
    if (b.type === 'dome') { g.beginPath(); g.arc(x + w / 2, y, w * 0.3, Math.PI, 0); g.fill(); g.stroke(); }
    if (b.type === 'spire') { g.beginPath(); g.moveTo(x + w / 2, y - 46); g.lineTo(x + w / 2, y); g.stroke(); }
    g.beginPath(); g.rect(x, y, w, h); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x - 4, y + 9); g.lineTo(x + w + 4, y + 9); g.stroke();
    const cols = Math.max(2, Math.floor(w / 24)), cw = (w - 14) / cols;
    let k = 0;
    for (let yy = y + 22; yy < base - 40; yy += 28) {
      for (let cI = 0; cI < cols; cI++) {
        const lv = o.lit ? o.lit(b.i, k) : 0; k++;
        g.fillStyle = lv > 0 ? mix(o.win, C.lit, lv) : o.win;
        g.fillRect(x + 7 + cI * cw + cw * 0.22, yy, cw * 0.56, 15);
      }
    }
    g.strokeRect(x + 7, base - 28, w - 14, 24);
  }
}
function tower(g, cx, base, tankTop, col, line) {
  const tankBot = tankTop + 82, deck = tankBot + 12;
  g.save(); g.strokeStyle = line; g.fillStyle = col; g.lineCap = 'round';
  g.lineWidth = 3.5;
  [[-54, -76], [54, 76], [-22, -28], [22, 28]].forEach(([a, b]) => { g.beginPath(); g.moveTo(cx + a, deck); g.lineTo(cx + b, base); g.stroke(); });
  g.lineWidth = 2;
  for (let y = deck + 6; y < base - 10; y += 40) {
    const k0 = (y - deck) / (base - deck), k1 = (y + 40 - deck) / (base - deck);
    const l0 = cx + lerp(-54, -76, k0), r0 = cx + lerp(54, 76, k0), l1 = cx + lerp(-54, -76, k1), r1 = cx + lerp(54, 76, k1);
    g.beginPath(); g.moveTo(l0, y); g.lineTo(r1, y + 40); g.moveTo(r0, y); g.lineTo(l1, y + 40); g.moveTo(l0, y); g.lineTo(r0, y); g.stroke();
  }
  g.fillRect(cx - 6, tankBot, 12, base - tankBot); g.strokeRect(cx - 6, tankBot, 12, base - tankBot);
  g.beginPath(); g.moveTo(cx - 80, deck - 16); g.lineTo(cx + 80, deck - 16);
  for (let x = cx - 80; x <= cx + 80; x += 12) { g.moveTo(x, deck - 16); g.lineTo(x, deck); }
  g.stroke(); rr(g, cx - 86, deck, 172, 8, 2); g.fill(); g.stroke();
  g.lineWidth = 3; rr(g, cx - 64, tankTop, 128, 82, 4); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(cx - 74, tankTop + 2); g.lineTo(cx, tankTop - 36); g.lineTo(cx + 74, tankTop + 2); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(cx, tankTop - 36); g.lineTo(cx, tankTop - 56); g.stroke(); g.beginPath(); g.arc(cx, tankTop - 61, 5, 0, 7); g.fill(); g.stroke();
  text(g, 'GILBERT', cx, tankTop + 52, '600 26px Lora', line, { sp: 3 });
  g.restore();
}
function palm(g, x, base, h, lean, col) {
  const tx = x + lean, ty = base - h;
  g.strokeStyle = col; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + lean * 0.2, base - h * 0.5, tx, ty); g.stroke();
  g.fillStyle = col;
  [-2.9, -2.45, -2.0, -1.55, -1.1, -0.65, -0.2].forEach(a => {
    const L = 84 - Math.abs(a + 1.55) * 6, ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L + 30;
    const mx = tx + Math.cos(a) * L * 0.55, my = ty + Math.sin(a) * L * 0.55 - 5, nx = -Math.sin(a) * 7, ny = Math.cos(a) * 7;
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx + nx, my + ny, ex, ey); g.quadraticCurveTo(mx - nx, my - ny, tx, ty); g.fill();
  });
}
function swag(g, p0, p1, p2, n, t, glow, r = 1) {
  g.strokeStyle = '#B9AE9C'; g.lineWidth = 1.6 * r;
  g.beginPath(); g.moveTo(...p0); g.quadraticCurveTo(...p1, ...p2); g.stroke();
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n, m = 1 - u;
    const x = m * m * p0[0] + 2 * m * u * p1[0] + u * u * p2[0], y = m * m * p0[1] + 2 * m * u * p1[1] + u * u * p2[1];
    const tw = 0.8 + 0.2 * Math.sin(t * 2.6 + i * 1.7 + p0[1]);
    const gr = g.createRadialGradient(x, y + 6 * r, 0, x, y + 6 * r, 26 * r);
    gr.addColorStop(0, `rgba(242,168,96,${0.5 * glow * tw})`); gr.addColorStop(1, 'rgba(242,168,96,0)');
    g.fillStyle = gr; g.fillRect(x - 26 * r, y - 20 * r, 52 * r, 52 * r);
    g.fillStyle = '#F7C57A'; g.beginPath(); g.ellipse(x, y + 6 * r, 4.5 * r, 6 * r, 0, 0, 7); g.fill();
  }
}

// ---------- background city (static, faded) ----------
const BG = canvas(W, H);
(function () {
  const g = BG.getContext('2d'), base = 1160;
  const back = layout(11, W, 360, 660), front = layout(37, W, 180, 380);
  g.globalAlpha = 0.75;
  drawCity(g, back, base, { fill: '#E9E5DD', line: '#DAD4C9', win: '#E1DCD2', lit: (i, k) => rnd(i + k * 13) > 0.78 ? 0.35 : 0 });
  tower(g, 850, base, 430, '#E6E1D8', '#D0C8BB');
  palm(g, 120, base, 470, -14, '#D7CFC2'); palm(g, 250, base, 380, 10, '#D7CFC2'); palm(g, 990, base, 420, -10, '#D7CFC2');
  drawCity(g, front, base, { fill: C.bldg, line: C.line, win: C.win, lit: (i, k) => rnd(i + k * 17) > 0.8 ? 0.45 : 0 });
  g.globalAlpha = 1;
  // fade the city into the cream: soft at the top, gone by the street
  const f = g.createLinearGradient(0, 300, 0, base + 10);
  f.addColorStop(0, 'rgba(246,243,236,0.15)'); f.addColorStop(0.45, 'rgba(246,243,236,0.25)');
  f.addColorStop(0.8, 'rgba(246,243,236,0.75)'); f.addColorStop(1, 'rgba(246,243,236,1)');
  g.fillStyle = f; g.fillRect(0, 0, W, base + 12);
  g.fillStyle = C.bg; g.fillRect(0, base + 10, W, H);
})();
function backdrop(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(540, 620, 0, 540, 620, 700);
  gl.addColorStop(0, 'rgba(243,220,179,0.55)'); gl.addColorStop(1, 'rgba(243,220,179,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = ease(seg(t, 0, 1.0)); ctx.drawImage(BG, 0, 0);
  swag(ctx, [-20, 330], [270, 430], [540, 345], 11, t, 1); swag(ctx, [540, 345], [810, 430], [1100, 330], 11, t, 1);
  ctx.restore();
}

// ---------- month photo: a little downtown ----------
const PB = layout(5, 1760, 230, 420), PF = layout(29, 1760, 120, 250);
function photo(g, t, night) {
  const { x, y, w, h } = PHOTO, d = night ? ease(seg(t, 5.0, 6.3)) : 0;
  g.save(); rr(g, x, y, w, h, 4); g.clip();
  const sky = g.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, mix('#F3DCB3', '#6F7591', d)); sky.addColorStop(0.6, mix('#F6E6CB', '#B8A2A6', d)); sky.addColorStop(1, mix('#F6F3EC', '#D9B59B', d));
  g.fillStyle = sky; g.fillRect(x, y, w, h);
  const base = y + h - 22, s = 0.42;
  const off = (i, k) => {                       // window lights: on at golden hour, switching off one by one
    if (!night) return 0;
    if (rnd(i * 3 + k * 11) < 0.45) return 0;
    const tOff = 5.0 + rnd(i * 31 + k * 7) * 1.3;
    return t < tOff ? 0.9 : (t < tOff + 0.08 ? 0.3 : 0);
  };
  g.save(); g.translate(x, base); g.scale(s, s);
  const fillB = mix('#E8E3DA', '#A9A3AA', d), fillF = mix(C.bldg, '#9A939B', d), ln = mix('#CFCAC1', '#857E88', d), wn = mix(C.win, '#8D8690', d);
  drawCity(g, PB, 0, { fill: fillB, line: ln, win: wn, lit: off, lw: 3 });
  tower(g, 1290, 0, -520, fillB, ln);
  palm(g, 160, 0, 420, -12, ln); palm(g, 1640, 0, 380, -10, ln);
  drawCity(g, PF, 0, { fill: fillF, line: ln, win: wn, lit: (i, k) => off(i + 500, k), lw: 3 });
  g.restore();
  g.fillStyle = mix('#EDE6DA', '#B5A9A3', d); g.fillRect(x, base, w, h);
  swag(g, [x - 10, y + 18], [x + w / 2, y + 62], [x + w + 10, y + 18], 17, t, night ? 1 + d : 0.8, 0.8);
  if (night) family(g, t);
  g.restore();
}

// ---------- Thanksgiving table ----------
const FAM = [
  { x: 150, top: '#9DAE95', skin: '#E9C9AE', hair: '#B9B3AA', st: 'bun', k: 1 },      // grandma
  { x: 232, top: '#C9886A', skin: '#B9876A', hair: '#2E2420', st: 'short', k: 1 },
  { x: 312, top: '#D8BE9C', skin: '#B9876A', hair: '#2E2420', st: 'pony', k: 0.78 },
  { x: 468, top: '#8F9C88', skin: '#DDB08E', hair: '#5A3A28', st: 'bob', k: 0.8 },
  { x: 548, top: '#E3D6C3', skin: '#DDB08E', hair: '#5A3A28', st: 'long', k: 1 },
  { x: 630, top: '#5D625B', skin: '#8E6550', hair: '#1E1715', st: 'short', k: 1 },
];
function family(g, t) {
  const f = ease(seg(t, 6.2, 7.0)); if (f <= 0) return;
  const ox = PHOTO.x, oy = PHOTO.y, tableY = oy + 206;
  g.save(); g.globalAlpha = f; g.translate(0, (1 - f) * 14);
  // candle glow over the whole scene
  [[ox + 340, 1.7], [ox + 440, 2.9]].forEach(([cx, ph]) => {
    const fl = 0.85 + 0.15 * Math.sin(t * 19 + ph) * Math.sin(t * 7.3 + ph);
    const gr = g.createRadialGradient(cx, tableY - 30, 0, cx, tableY - 30, 150 * fl);
    gr.addColorStop(0, 'rgba(255,196,110,0.42)'); gr.addColorStop(1, 'rgba(255,196,110,0)');
    g.fillStyle = gr; g.fillRect(cx - 160, tableY - 190, 320, 260);
  });
  FAM.forEach((p, i) => {
    const k = p.k, x = ox + p.x, bob = Math.max(0, Math.sin(t * 5 + i * 1.3)) * 2.5 * (i % 2 ? 1 : 0.5);
    g.save(); g.translate(x, tableY - bob); g.scale(k, k);
    g.fillStyle = p.top; rr(g, -24, -56, 48, 60, [18, 18, 4, 4]); g.fill();
    g.fillStyle = p.skin; g.fillRect(-4, -66, 8, 12);
    g.save(); g.translate(0, -78); g.rotate(0.06 * Math.sin(t * 3 + i));
    g.fillStyle = p.hair;
    if (p.st === 'long') { rr(g, -17, -14, 34, 34, 12); g.fill(); }
    if (p.st === 'bob') { rr(g, -17, -14, 34, 24, 10); g.fill(); }
    g.fillStyle = p.skin; g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill();
    g.fillStyle = p.hair; g.beginPath(); g.arc(0, -2, 15, Math.PI * 1.02, Math.PI * 1.98); g.fill();
    if (p.st === 'bun') { g.beginPath(); g.arc(0, -17, 7, 0, 7); g.fill(); }
    if (p.st === 'pony') { g.beginPath(); g.ellipse(13, 2, 5, 11, -0.3, 0, 7); g.fill(); }
    g.restore();
    g.fillStyle = p.skin; g.beginPath(); g.ellipse(-20, -4, 9, 5, 0, 0, 7); g.ellipse(20, -4, 9, 5, 0, 0, 7); g.fill();
    g.restore();
  });
  // table + cloth + runner
  g.fillStyle = '#F4EEE3'; g.beginPath(); g.moveTo(ox + 96, tableY - 8); g.lineTo(ox + 684, tableY - 8); g.lineTo(ox + 700, tableY + 8); g.lineTo(ox + 80, tableY + 8); g.closePath(); g.fill();
  g.fillStyle = '#EDE5D7'; g.fillRect(ox + 80, tableY + 8, 620, 50);
  g.strokeStyle = '#D8CCBA'; g.lineWidth = 1.5;
  for (let xx = ox + 80; xx < ox + 700; xx += 31) { g.beginPath(); g.moveTo(xx, tableY + 10); g.lineTo(xx, tableY + 58); g.stroke(); }
  g.fillStyle = '#C08562'; g.fillRect(ox + 300, tableY - 6, 180, 12);
  // plates
  FAM.forEach(p => { g.fillStyle = '#FFFFFF'; g.beginPath(); g.ellipse(ox + p.x, tableY + 1, 15, 4.5, 0, 0, 7); g.fill(); });
  // turkey
  const tx = ox + 390, ty = tableY - 12;
  g.fillStyle = '#E9E2D6'; g.beginPath(); g.ellipse(tx, ty + 10, 44, 9, 0, 0, 7); g.fill();
  g.fillStyle = '#B5713F'; g.beginPath(); g.ellipse(tx, ty - 6, 32, 20, 0, Math.PI, 0); g.lineTo(tx + 32, ty + 6); g.lineTo(tx - 32, ty + 6); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,230,190,0.5)'; g.beginPath(); g.ellipse(tx - 10, ty - 14, 10, 4, -0.3, 0, 7); g.fill();
  g.strokeStyle = '#9C5E33'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(tx - 22, ty - 4); g.lineTo(tx - 36, ty - 18); g.moveTo(tx + 22, ty - 4); g.lineTo(tx + 36, ty - 18); g.stroke();
  g.fillStyle = '#F4EEE3'; g.beginPath(); g.arc(tx - 38, ty - 20, 4, 0, 7); g.arc(tx + 38, ty - 20, 4, 0, 7); g.fill();
  // pie
  g.fillStyle = '#D9A15E'; g.beginPath(); g.ellipse(ox + 520, tableY - 4, 20, 6, 0, 0, 7); g.fill();
  g.fillStyle = '#C97A4A'; g.beginPath(); g.ellipse(ox + 520, tableY - 6, 15, 4, 0, 0, 7); g.fill();
  // candles
  [[ox + 340, 1.7], [ox + 440, 2.9]].forEach(([cx, ph]) => {
    g.fillStyle = '#F7F1E6'; g.fillRect(cx - 3.5, tableY - 40, 7, 34);
    g.fillStyle = '#C9A96A'; g.fillRect(cx - 7, tableY - 8, 14, 5);
    const fl = 1 + 0.18 * Math.sin(t * 23 + ph) + 0.08 * Math.sin(t * 41 + ph * 2);
    g.save(); g.translate(cx + Math.sin(t * 13 + ph) * 0.8, tableY - 42); g.scale(1, fl);
    g.fillStyle = '#F7C057'; g.beginPath(); g.moveTo(0, -14); g.quadraticCurveTo(7, -2, 0, 2); g.quadraticCurveTo(-7, -2, 0, -14); g.fill();
    g.fillStyle = '#FFF2C4'; g.beginPath(); g.ellipse(0, -3, 2, 4, 0, 0, 7); g.fill();
    g.restore();
  });
  g.restore();
}

// ---------- calendar pages ----------
const CLASSES = { 0: 1, 1: 3, 2: 4, 3: 3, 4: 3, 5: 0, 6: 3 };
function pageBody(g, t, m) {
  g.fillStyle = C.page; g.fillRect(0, 0, PW, PH);
  // perforation the page tears along
  g.fillStyle = '#D8D0C3'; for (let x = 8; x < PW; x += 12) { g.beginPath(); g.arc(x, TEAR, 1.8, 0, 7); g.fill(); }
  photo(g, t, m.night);
  const by = PHOTO.y + PHOTO.h + 8;
  g.fillStyle = C.band; g.fillRect(0, by, PW, 70);
  text(g, m.name, PW / 2, by + 50, 'italic 500 54px Lora', '#F6F3EC', { sp: 1 });
  const dy = by + 104, cw = (PW - 48) / 7;
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d, i) => text(g, d, 24 + cw * (i + 0.5), dy, '500 15px Poppins', C.soft, { sp: 3 }));
  const gy = dy + 22, chH = 76;
  for (let i = 0; i < m.first; i++) text(g, String(m.prev - m.first + 1 + i), 24 + cw * (i + 0.5), gy + 34, '500 26px Poppins', C.dim);
  for (let d = 1; d <= m.days; d++) {
    const idx = m.first + d - 1, col = idx % 7, row = Math.floor(idx / 7), cx = 24 + cw * (col + 0.5), cy = gy + row * chH;
    const kind = m.mark(d, col);
    if (kind === 'closed') {
      text(g, String(d), cx, cy + 32, '500 21px Poppins', C.terra);
      text(g, 'CLOSED', cx, cy + 54, '500 11px Poppins', C.terra, { sp: 2 });
    } else {
      text(g, String(d), cx, cy + 34, '500 26px Poppins', C.char);
      if (kind) {
        g.fillStyle = kind === 'ev' ? C.terra : C.sage;
        g.beginPath(); g.arc(cx, cy + 52, kind === 'ev' ? 5.5 : 3.5, 0, 7); g.fill();
      }
    }
  }
}
const OCT = { name: 'October', first: 4, days: 31, prev: 30, night: false,
  mark: (d, col) => d === 27 ? 'ev' : (d >= 25 && CLASSES[col] ? 'cls' : null) };
const NOV = { name: 'November', first: 0, days: 30, prev: 31, night: true,
  mark: (d, col) => [26, 27].includes(d) ? 'closed' : d === 1 ? 'ev' : (CLASSES[col] ? 'cls' : null) };
const OCT_C = canvas(PW, PH), NOV_C = canvas(PW, PH), STACK = canvas(W, H);

// torn edge shared by the stub and the page so they fit together
const jag = x => TEAR + 3 + (rnd(Math.floor(x / 9)) - 0.5) * 9;
function topEdge(g, fromX, toX) { for (let x = fromX; x <= toX; x += 9) g.lineTo(x, jag(x)); }

function ripState(t) {
  const tug = Math.sin(Math.PI * seg(t, 2.5, 2.8)) * 0.025;
  const u = ease(seg(t, 2.8, 3.4)), v = eIn(seg(t, 3.4, 4.3));
  return { a: -tug - 0.26 * u - 0.75 * v, tx: 980 * v, ty: -760 * v + 60 * Math.sin(Math.PI * v), s: 1 - 0.12 * v, gone: v >= 1 };
}
function pageXf(g, st) {      // page space -> screen, pivoting at the left end of the tear line
  g.translate(PX + st.tx, PY + TEAR + st.ty); g.rotate(st.a); g.scale(st.s, st.s); g.translate(0, -TEAR);
}

// ---------- the hand ----------
const SKIN_L = '#F7D0B3', SKIN_D = '#E3A885', SKIN_LINE = '#C98E6E', NAIL = '#B9587A';
function finger(g, a, b, wd, nail = true) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  g.save(); g.translate(a[0], a[1]); g.rotate(Math.atan2(dy, dx));

function drawHand(g, close) {

  g.bezierCurveTo(-60, -150, -64, -100, -44, -62); g.lineTo(-36, -52);
  g.quadraticCurveTo(2, -38, 42, -54); g.bezierCurveTo(54, -84, 58, -140, 48, -190); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,240,228,.45)'; g.beginPath(); g.ellipse(-12, -128, 18, 40, 0.2, 0, 7); g.fill();

  const rL = finger(g, [20, -54], [25, -20], 23);
  g.save(); g.translate(20, -54); g.rotate(Math.atan2(34, 5)); g.strokeStyle = '#D9B158'; g.lineWidth = 4; g.beginPath(); g.moveTo(rL * 0.55, -12); g.lineTo(rL * 0.55, 12); g.stroke(); g.restore();

  finger(g, [-26, -58], [-8 + 10 * (1 - close), -6 - 8 * (1 - close)], 27);

  g.strokeStyle = '#D4A94F'; g.lineWidth = 6; g.beginPath(); g.ellipse(0, -172, 54, 9, 0, 0.05, Math.PI - 0.05); g.stroke();
  g.fillStyle = '#E9DCC9'; rr(g, -66, -380, 132, 196, 28); g.fill();
  g.fillStyle = '#DCCCB5'; rr(g, -64, -206, 128, 30, 13); g.fill();
  g.strokeStyle = 'rgba(150,130,100,.35)'; g.lineWidth = 2;

const GRIP = [PW - 52, TEAR + 44];
function handState(t, st) {

// ---------- frame ----------
function render(t) {
  backdrop(t);
  // heading; "save your spot" flickers on like a sign at the end
  const ha = ease(seg(t, 0.1, 0.9));
  text(ctx, 'THIS WEEK + NOVEMBER', 540, 150, '500 30px Poppins', C.terra, { sp: 9, alpha: ha });
  const pattern = [1, 0, 1, 1, 0, 0, 1, 0, 1, 1];
  let lit = 0;
  if (t >= 7.5) lit = t < 8.5 ? pattern[Math.floor((t - 7.5) / 0.1)] : 1;
  ctx.save();
  if (lit) { ctx.shadowColor = 'rgba(242,168,96,0.9)'; ctx.shadowBlur = 26 + 6 * Math.sin(t * 9); }
  text(ctx, 'save your spot', 540, 262, 'italic 500 92px Lora', lit ? '#B8743F' : '#5D625B', { alpha: ha * (t >= 7.5 && !lit ? 0.35 : 1) });
  ctx.restore();

  // calendar drop-in
  const drop = eOut(seg(t, 0.2, 1.3));
  ctx.save(); ctx.globalAlpha = Math.min(1, drop * 2); ctx.translate(0, (1 - drop) * -120);

  const st = ripState(t);
  OCT_C.getContext('2d').clearRect(0, 0, PW, PH); pageBody(OCT_C.getContext('2d'), t, OCT);
  NOV_C.getContext('2d').clearRect(0, 0, PW, PH); pageBody(NOV_C.getContext('2d'), t, NOV);
  const g = STACK.getContext('2d'); g.clearRect(0, 0, W, H);
  g.save(); g.shadowColor = 'rgba(60,50,30,0.25)'; g.shadowBlur = 36; g.shadowOffsetY = 18;
  g.drawImage(NOV_C, PX, PY); g.restore();
  // October's torn stub stays under the felt
  if (t > 2.8) {
    g.save(); g.beginPath(); g.moveTo(PX, PY); g.lineTo(PX + PW, PY); g.lineTo(PX + PW, PY + jag(PW));
    for (let x = PW; x >= 0; x -= 9) g.lineTo(PX + x, PY + jag(x)); g.closePath(); g.clip();
    g.drawImage(OCT_C, PX, PY); g.restore();
  }
  if (!st.gone) {
    g.save(); pageXf(g, st);
    g.beginPath(); g.moveTo(0, t > 2.8 ? jag(0) : 0); if (t > 2.8) topEdge(g, 0, PW); else g.lineTo(PW, 0);
    g.lineTo(PW, PH); g.lineTo(0, PH); g.closePath();
    g.save(); g.shadowColor = 'rgba(60,50,30,0.28)'; g.shadowBlur = 30 + 30 * seg(t, 2.8, 3.6); g.shadowOffsetY = 18 + 30 * seg(t, 2.8, 3.6);

    g.clip(); g.drawImage(OCT_C, 0, 0);
    // pinch shadow under the fingertips

  ctx.save(); ctx.globalAlpha *= 0.9; ctx.drawImage(STACK, 0, 0); ctx.restore();

  // felt board + pins
  ctx.save();
  rr(ctx, PX - 30, PY - 80, PW + 60, 120, 14);
  ctx.shadowColor = 'rgba(60,50,30,.35)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 14; ctx.fillStyle = '#7A876B'; ctx.fill();
  ctx.restore();
  ctx.save(); rr(ctx, PX - 30, PY - 80, PW + 60, 120, 14); ctx.clip();
  ctx.strokeStyle = '#6F7C61'; ctx.lineWidth = 3;
  for (let x = PX - 160; x < PX + PW + 60; x += 6) { ctx.beginPath(); ctx.moveTo(x, PY + 40); ctx.lineTo(x + 120, PY - 80); ctx.stroke(); }
  ctx.strokeStyle = '#6B7760'; ctx.lineWidth = 6; rr(ctx, PX - 30, PY - 80, PW + 60, 120, 14); ctx.stroke();
  ctx.restore();
  [PX + 60, PX + 340, PX + 620].forEach(x => {
    const pg = ctx.createRadialGradient(x + 3, PY - 81, 1, x + 10, PY - 76, 11);
    pg.addColorStop(0, '#E8C7B0'); pg.addColorStop(1, '#A8714F');
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 3;
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x + 10, PY - 76, 10, 0, 7); ctx.fill(); ctx.restore();
  });

  // the hand
  const hs = handState(t, st);
  if (hs.show) { ctx.save(); ctx.translate(hs.x, hs.y); ctx.rotate(hs.rot); ctx.scale(1.15, 1.15); drawHand(ctx, hs.close); ctx.restore(); }
  ctx.restore();

  // CTA

    ctx.save(); ctx.globalAlpha = ca; ctx.fillStyle = C.band; rr(ctx, 540 - 230, 1712 + (1 - ca) * 20, 460, 92, 46); ctx.fill(); ctx.restore();

  }
}

window.render = render; window.DURATION = DURATION;
Promise.all([document.fonts.load('500 20px Poppins'), document.fonts.load('italic 500 20px Lora'), document.fonts.load('600 20px Lora')])
  .then(() => { render(0); window.ready = true; });
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { if (window.ready) render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
