<!doctype html>
<html><head><meta charset="utf-8"><title>Gilbert Flex Calendar Reel</title>
<style>
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Lora;src:url(fonts/Lora.ttf);font-weight:400 700;font-style:normal}
@font-face{font-family:Lora;src:url(fonts/Lora-Italic.ttf);font-weight:400 700;font-style:italic}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F6F3EC;font-family:Poppins,system-ui,sans-serif}
#scene{position:absolute;inset:0}
#sky{position:absolute;left:0;top:520px;width:1080px;height:620px}
#cal{position:absolute;left:150px;top:330px;width:780px;height:1000px;perspective:2200px}
#felt{position:absolute;left:-30px;top:-40px;width:840px;height:120px;border-radius:14px;
  background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(45deg,#7E8B6F 0 3px,#748265 3px 6px);
  box-shadow:0 14px 26px rgba(60,50,30,.35),inset 0 0 0 3px #6B7760}
.pin{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8C7B0,#A8714F);box-shadow:0 3px 4px rgba(0,0,0,.35)}
#board{position:absolute;left:0;top:70px;width:780px;height:900px;transform-style:preserve-3d;transform:rotateY(-5deg) rotateZ(-1deg)}
.page{position:absolute;inset:0;background:#FBF8F1;border-radius:6px;box-shadow:0 22px 40px rgba(60,50,30,.28);overflow:hidden;backface-visibility:hidden;transform-origin:50% 0%}
.page .photo{height:330px;position:relative;overflow:hidden}
.page .photo svg{position:absolute;inset:0;width:100%;height:100%}
.mname{position:absolute;left:0;right:0;bottom:0;height:86px;background:#5D625B;color:#F6F3EC;display:flex;align-items:center;justify-content:center;font:italic 500 58px Lora,Georgia,serif;letter-spacing:1px}
.dows,.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 24px}
.dows{margin-top:14px;font:500 15px Poppins;letter-spacing:3px;color:#7A7E77;text-align:center}
.grid{grid-auto-rows:70px;row-gap:4px;margin-top:6px}
.cell{position:relative;text-align:center;font:500 26px Poppins;color:#3E443E;padding-top:6px}
.cell.dim{color:#CFC8BC}
.cell .dot{position:absolute;left:50%;bottom:4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#A8714F;opacity:0}
.cell.cls .dot{opacity:1;background:#8F9C88}
.cell.closed{font-size:20px;color:#A8714F}
.cell.closed::after{content:"closed";position:absolute;left:0;right:0;bottom:2px;font:500 11px Poppins;letter-spacing:2px;color:#A8714F}
.cell.ev .dot{opacity:1;background:#A8714F;width:11px;height:11px;margin-left:-5.5px}
#stain{position:absolute;left:560px;top:250px;width:190px;height:165px;opacity:0;pointer-events:none;mix-blend-mode:multiply}
#cta{position:absolute;left:0;right:0;top:1590px;text-align:center;opacity:0}
#cta span{display:inline-block;background:#5D625B;color:#F6F3EC;font:500 34px Poppins;letter-spacing:2px;padding:22px 46px;border-radius:60px}
#head{position:absolute;left:0;right:0;top:80px;text-align:center;opacity:0}
#head .k{font:500 30px Poppins;letter-spacing:9px;color:#A8714F}
#head .h{font:italic 500 84px Lora,Georgia,serif;color:#5D625B;margin-top:4px}
#foot{position:absolute;left:0;right:0;top:1470px;text-align:center;font:500 22px Poppins;letter-spacing:4px;color:#5D625B;opacity:0}
</style></head><body>

<div id="scene">
  <div id="head"><div class="k">THIS WEEK + NOVEMBER</div><div class="h">save your spot</div></div>
  <div id="sky"></div>
  <div id="cal">
    <div id="felt"><div class="pin" style="left:90px"></div><div class="pin" style="left:370px"></div><div class="pin" style="left:650px"></div></div>
    <div id="board">
      <div class="page" id="nov"></div>
      <div class="page" id="oct"></div>
    </div>
    <svg id="stain" viewBox="0 0 300 260"><defs><radialGradient id="sg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B5E34" stop-opacity=".22"/><stop offset=".75" stop-color="#8B5E34" stop-opacity=".16"/><stop offset=".92" stop-color="#6B4422" stop-opacity=".32"/><stop offset="1" stop-color="#6B4422" stop-opacity="0"/></radialGradient></defs><path d="M150 14 C 220 6 290 60 286 130 C 284 200 236 252 150 250 C 74 252 14 206 16 132 C 18 58 84 22 150 14 Z" fill="url(#sg)"/></svg>
  </div>
  <div id="foot">tap in · link in bio</div>
  <div id="cta"><span>book · link in bio</span></div>
</div>
<script>
const TOWN=document.getElementById('town').innerHTML;
document.getElementById('sky').innerHTML=TOWN;
const FELT=true;
const CLASSES={0:1,1:3,2:4,3:3,4:3,5:0,6:3};   // class count per weekday (from the link-page schedule)
const CLOSED=[26,27];                             // Thanksgiving Thu Nov 26 + Fri Nov 27 (Nov 2026)
const EVENTS={1:"ev",27:"ev"};                    // Nov 1 release event; Oct 27 is on the October page
function buildPage(el, name, firstDow, days, prevDays, withEv){
  let h='<div class="photo">'+TOWN.replace('<svg ','<svg preserveAspectRatio="xMidYMid slice" ')+'</div><div class="mname">'+name+'</div><div class="dows">';
  ['S','M','T','W','T','F','S'].forEach(d=>h+='<span>'+d+'</span>');
  h+='</div><div class="grid">';
  for(let i=0;i<firstDow;i++) h+='<div class="cell dim">'+(prevDays-firstDow+1+i)+'</div>';
  for(let d=1; d<=days; d++){
    const dow=(firstDow+d-1)%7; let cls='cell';
    if(withEv && CLOSED.includes(d)) cls+=' closed';
    else if(withEv && EVENTS[d]) cls+=' '+EVENTS[d];
    else if(withEv && CLASSES[dow]) cls+=' cls';
    h+='<div class="'+cls+'">'+d+'<span class="dot"></span></div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
buildPage(document.getElementById('oct'),'October',4,31,30,false);   // Oct 1 2026 = Thursday
buildPage(document.getElementById('nov'),'November',0,30,31,true);   // Nov 1 2026 = Sunday
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const ease2=x=>x<0?0:x>1?1:(x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
window.DURATION=8;
window.render=function(t){
  // 0.0-1.4s: felt board + calendar drop in
  const drop=ease((t-.2)/1.2);
  document.getElementById('cal').style.transform=`translateY(${(1-drop)*-120}px) rotateX(${(1-drop)*8}deg)`;
  document.getElementById('cal').style.opacity=Math.min(1,drop*2);
  // head + sky fade
  document.getElementById('head').style.opacity=ease((t-.1)/.8);
  document.getElementById('sky').style.opacity=ease(t/1.2);
  // 2.2-3.6s: October flips up and off (hinge at top)
  const flip=ease2((t-2.2)/1.4);
  const oct=document.getElementById('oct');
  oct.style.transform=`rotateX(${-180*flip}deg)`;
  oct.style.opacity=flip>.5?0:1;
  oct.style.transformOrigin='50% 0%';
  // 3.4s+: coffee stain fades in as if spilled onto the page
  const st=document.getElementById('stain');
  st.style.opacity=ease((t-3.4)/1.0)*.55;
  // 4.6s+: footer + CTA
  document.getElementById('foot').style.opacity=ease((t-4.6)/.8);
  document.getElementById('cta').style.opacity=ease((t-5.4)/.8);
};
render(0);
Promise.all([document.fonts.load('500 20px Poppins'),document.fonts.load('italic 500 20px Lora'),document.fonts.load('400 20px Lora')]).then(()=>{window.ready=true;});
if(!navigator.webdriver){ const t0=performance.now(); (function loop(){ render(((performance.now()-t0)/1000)%8); requestAnimationFrame(loop); })(); }
</script>
