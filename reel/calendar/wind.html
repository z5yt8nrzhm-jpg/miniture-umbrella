<!doctype html>
<html><head><meta charset="utf-8"><title>Gilbert Flex Calendar Wind</title>
<style>
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Lora;src:url(fonts/Lora.ttf);font-weight:400 700;font-style:normal}
@font-face{font-family:Lora;src:url(fonts/Lora-Italic.ttf);font-weight:400 700;font-style:italic}
html,body{margin:0;background:#F6F3EC}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Calendar reel: a gust blows October away to reveal November, the city's windows go dark
// under the string lights, and "save your spot" flickers on.
const W = 1080, H = 1920, DURATION = 10;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const C = { bg: '#F6F3EC', page: '#FBF8F1', char: '#3E443E', band: '#5D625B', terra: '#A8714F', sage: '#8F9C88',
  soft: '#7A7E77', dim: '#CFC8BC', bldg: '#E2DED6', line: '#CFCAC1', win: '#D9D4CB', lit: '#F4CF86' };
const PX = 150, PY = 1060, PW = 780, PH = 560, CITY_BASE = 1120;
const T_REVEAL = 3.4, T_OFF = 4.3;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const eIn = x => { x = clamp(x); return x * x; };
const lerp = (a, b, p) => a + (b - a) * p;
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(g, s, x, y, font, color, { sp = 0, align = 'center', alpha = 1 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = font; g.fillStyle = color; g.letterSpacing = sp + 'px'; g.textAlign = align;
  g.fillText(s, x + (align === 'center' ? sp / 2 : 0), y); g.restore();
}
function canvas(w, h) { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; }

// ---------- the city ----------
function layout(seed, width, minH, maxH) {
  const out = []; let x = -20, i = 0;
  while (x < width + 20) {
    const w = 64 + rnd(seed + i * 3) * 76;
    const h = minH + (maxH - minH) * Math.pow(rnd(seed + i * 7 + 1), 0.9);
    out.push({ x, w, h, type: ['flat', 'step', 'dome', 'spire', 'flat', 'step'][Math.floor(rnd(seed + i * 5 + 2) * 6)], i: seed * 100 + i });
    x += w - 2; i++;
  }
  return out;
}
function drawCity(g, L, base, o) {
  for (const b of L) {
    const { x, w, h } = b, y = base - h;
    g.fillStyle = o.fill; g.strokeStyle = o.line; g.lineWidth = 2;
    if (b.type === 'step') { g.beginPath(); g.rect(x + w * 0.22, y - 24, w * 0.56, 24); g.fill(); g.stroke(); }
    if (b.type === 'dome') { g.beginPath(); g.arc(x + w / 2, y, w * 0.3, Math.PI, 0); g.fill(); g.stroke(); }
    if (b.type === 'spire') { g.beginPath(); g.moveTo(x + w / 2, y - 46); g.lineTo(x + w / 2, y); g.stroke(); }
    g.beginPath(); g.rect(x, y, w, h); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x - 4, y + 9); g.lineTo(x + w + 4, y + 9); g.stroke();
    const cols = Math.max(2, Math.floor(w / 24)), cw = (w - 14) / cols;
    let k = 0;
    for (let yy = y + 22; yy < base - 40; yy += 28) {
      for (let cI = 0; cI < cols; cI++) {
        const lv = o.lit(b.i, k); k++;
        g.fillStyle = lv > 0 ? mix(o.win, C.lit, lv) : o.win;
        g.fillRect(x + 7 + cI * cw + cw * 0.22, yy, cw * 0.56, 15);
      }
    }
    g.strokeRect(x + 7, base - 28, w - 14, 24);
  }
}
function tower(g, cx, base, tankTop, col, line) {
  const tankBot = tankTop + 82, deck = tankBot + 12;
  g.save(); g.strokeStyle = line; g.fillStyle = col; g.lineCap = 'round';
  g.lineWidth = 3.5;
  [[-54, -76], [54, 76], [-22, -28], [22, 28]].forEach(([a, b]) => { g.beginPath(); g.moveTo(cx + a, deck); g.lineTo(cx + b, base); g.stroke(); });
  g.lineWidth = 2;
  for (let y = deck + 6; y < base - 10; y += 40) {
    const k0 = (y - deck) / (base - deck), k1 = (y + 40 - deck) / (base - deck);
    const l0 = cx + lerp(-54, -76, k0), r0 = cx + lerp(54, 76, k0), l1 = cx + lerp(-54, -76, k1), r1 = cx + lerp(54, 76, k1);
    g.beginPath(); g.moveTo(l0, y); g.lineTo(r1, y + 40); g.moveTo(r0, y); g.lineTo(l1, y + 40); g.moveTo(l0, y); g.lineTo(r0, y); g.stroke();
  }
  g.fillRect(cx - 6, tankBot, 12, base - tankBot); g.strokeRect(cx - 6, tankBot, 12, base - tankBot);
  g.beginPath(); g.moveTo(cx - 80, deck - 16); g.lineTo(cx + 80, deck - 16);
  for (let x = cx - 80; x <= cx + 80; x += 12) { g.moveTo(x, deck - 16); g.lineTo(x, deck); }
  g.stroke(); rr(g, cx - 86, deck, 172, 8, 2); g.fill(); g.stroke();
  g.lineWidth = 3; rr(g, cx - 64, tankTop, 128, 82, 4); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(cx - 74, tankTop + 2); g.lineTo(cx, tankTop - 36); g.lineTo(cx + 74, tankTop + 2); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(cx, tankTop - 36); g.lineTo(cx, tankTop - 56); g.stroke(); g.beginPath(); g.arc(cx, tankTop - 61, 5, 0, 7); g.fill(); g.stroke();
  text(g, 'GILBERT', cx, tankTop + 52, '600 26px Lora', line, { sp: 3 });
  g.restore();
}
function palm(g, x, base, h, lean, col) {
  const tx = x + lean, ty = base - h;
  g.strokeStyle = col; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + lean * 0.2, base - h * 0.5, tx, ty); g.stroke();
  g.fillStyle = col;
  [-2.9, -2.45, -2.0, -1.55, -1.1, -0.65, -0.2].forEach(a => {
    const L = 84 - Math.abs(a + 1.55) * 6, ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L + 30;
    const mx = tx + Math.cos(a) * L * 0.55, my = ty + Math.sin(a) * L * 0.55 - 5, nx = -Math.sin(a) * 7, ny = Math.cos(a) * 7;
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx + nx, my + ny, ex, ey); g.quadraticCurveTo(mx - nx, my - ny, tx, ty); g.fill();
  });
}
// string lights: brighter bulbs that wash a soft warm glow onto the buildings below
function swag(g, p0, p1, p2, n, t, glow) {
  g.strokeStyle = '#B9AE9C'; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(...p0); g.quadraticCurveTo(...p1, ...p2); g.stroke();
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n, m = 1 - u;
    const x = m * m * p0[0] + 2 * m * u * p1[0] + u * u * p2[0], y = m * m * p0[1] + 2 * m * u * p1[1] + u * u * p2[1];
    const tw = 0.82 + 0.18 * Math.sin(t * 2.6 + i * 1.7 + p0[1]);
    const wash = g.createRadialGradient(x, y + 90, 0, x, y + 90, 190);
    wash.addColorStop(0, `rgba(250,200,130,${0.07 * glow * tw})`); wash.addColorStop(1, 'rgba(250,200,130,0)');
    g.fillStyle = wash; g.fillRect(x - 190, y - 100, 380, 380);
    const halo = g.createRadialGradient(x, y + 7, 0, x, y + 7, 30);
    halo.addColorStop(0, `rgba(255,190,100,${0.5 * glow * tw})`); halo.addColorStop(1, 'rgba(255,190,100,0)');
    g.fillStyle = halo; g.fillRect(x - 34, y - 27, 68, 68);
    g.fillStyle = '#FFE2A6'; g.beginPath(); g.ellipse(x, y + 7, 5.5, 7.5, 0, 0, 7); g.fill();
  }
}
const BACK = layout(11, W, 380, 700), FRONT = layout(37, W, 190, 400);
const CITY = canvas(W, H);
function city(t) {
  const g = CITY.getContext('2d'), base = CITY_BASE;
  g.clearRect(0, 0, W, H);
  // windows glow until November arrives, then switch off one by one
  const lit = (seed, amt) => (i, k) => {
    if (rnd(i + k * seed) < 1 - amt) return 0;
    const tOff = T_OFF + rnd(i * 31 + k * 7) * 1.6;
    return t < tOff ? 0.85 : (t < tOff + 0.07 ? 0.25 : 0);
  };
  drawCity(g, BACK, base, { fill: '#E9E5DD', line: '#DAD4C9', win: '#E1DCD2', lit: lit(13, 0.32) });
  tower(g, 850, base, 400, '#E6E1D8', '#D0C8BB');
  palm(g, 120, base, 500, -14, '#D7CFC2'); palm(g, 250, base, 400, 10, '#D7CFC2'); palm(g, 990, base, 440, -10, '#D7CFC2');
  drawCity(g, FRONT, base, { fill: C.bldg, line: C.line, win: C.win, lit: lit(17, 0.38) });
  // soft fade into the cream toward the street
  const f = g.createLinearGradient(0, 300, 0, base + 10);
  f.addColorStop(0, 'rgba(246,243,236,0.1)'); f.addColorStop(0.5, 'rgba(246,243,236,0.2)');
  f.addColorStop(0.85, 'rgba(246,243,236,0.7)'); f.addColorStop(1, 'rgba(246,243,236,1)');
  g.fillStyle = f; g.fillRect(0, 0, W, base + 12);
  return CITY;
}
function backdrop(t) {
  const d = ease(seg(t, T_OFF, T_OFF + 1.6));   // city settles into evening once its lights go out
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(540, 700, 0, 540, 700, 760);
  gl.addColorStop(0, `rgba(243,220,179,${0.55 - 0.15 * d})`); gl.addColorStop(1, 'rgba(243,220,179,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  const fade = ease(seg(t, 0, 1.0));
  ctx.save(); ctx.globalAlpha = fade * (1 - 0.18 * d); ctx.drawImage(city(t), 0, 0); ctx.restore();
  ctx.save(); ctx.globalAlpha = fade;
  const glow = 1 + 0.3 * d;
  swag(ctx, [-20, 330], [270, 440], [540, 350], 11, t, glow); swag(ctx, [540, 350], [810, 440], [1100, 330], 11, t, glow);
  ctx.restore();
}

// ---------- calendar cards ----------
const CLASSES = { 0: 1, 1: 3, 2: 4, 3: 3, 4: 3, 5: 0, 6: 3 };
function card(g, m) {
  g.fillStyle = C.page; rr(g, 0, 0, PW, PH, 10); g.fill();
  g.save(); rr(g, 0, 0, PW, PH, 10); g.clip();
  g.fillStyle = C.band; g.fillRect(0, 0, PW, 80);
  text(g, m.name, PW / 2, 56, 'italic 500 56px Lora', '#F6F3EC', { sp: 1 });
  g.restore();
  const dy = 118, cw = (PW - 48) / 7;
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d, i) => text(g, d, 24 + cw * (i + 0.5), dy, '500 15px Poppins', C.soft, { sp: 3 }));
  const gy = dy + 18, chH = 78;
  for (let i = 0; i < m.first; i++) text(g, String(m.prev - m.first + 1 + i), 24 + cw * (i + 0.5), gy + 34, '500 26px Poppins', C.dim);
  for (let d = 1; d <= m.days; d++) {
    const idx = m.first + d - 1, col = idx % 7, row = Math.floor(idx / 7), cx = 24 + cw * (col + 0.5), cy = gy + row * chH;
    const kind = m.mark(d, col);
    if (kind === 'closed') {
      text(g, String(d), cx, cy + 32, '500 21px Poppins', C.terra);
      text(g, 'CLOSED', cx, cy + 54, '500 11px Poppins', C.terra, { sp: 2 });
    } else {
      text(g, String(d), cx, cy + 34, '500 26px Poppins', C.char);
      if (kind) { g.fillStyle = kind === 'ev' ? C.terra : C.sage; g.beginPath(); g.arc(cx, cy + 52, kind === 'ev' ? 5.5 : 3.5, 0, 7); g.fill(); }
    }
  }
}
const OCT = { name: 'October', first: 4, days: 31, prev: 30, mark: (d, col) => d === 27 ? 'ev' : (d >= 25 && CLASSES[col] ? 'cls' : null) };
const NOV = { name: 'November', first: 0, days: 30, prev: 31, mark: (d, col) => [26, 27].includes(d) ? 'closed' : d === 1 ? 'ev' : (CLASSES[col] ? 'cls' : null) };
const OCT_C = canvas(PW, PH), NOV_C = canvas(PW, PH);

// ---------- wind ----------
// October ripples from its right edge, lifts, then tumbles off up and to the right
function octoberInWind(t) {
  const flap = seg(t, 1.9, 2.7), go = eIn(seg(t, 2.5, 3.9));
  if (go >= 1) return;
  const wave = 26 * ease(flap) * (1 - go * 0.5), lift = 60 * ease(flap);
  const fx = 1250 * go, fy = -640 * go - 80 * Math.sin(Math.PI * go);
  const rot = -0.06 * ease(flap) - 0.5 * go + 0.12 * Math.sin(t * 7) * go;
  const flip = 1 - 0.55 * go * (0.5 + 0.5 * Math.cos(t * 9));   // flutters edge-on as it tumbles
  ctx.save();
  ctx.translate(PX + fx, PY + PH / 2 + fy); ctx.rotate(rot); ctx.scale(flip * (1 - 0.25 * go), 1 - 0.2 * go); ctx.translate(0, -PH / 2);
  ctx.shadowColor = 'rgba(60,50,30,0.25)'; ctx.shadowBlur = 30 + 30 * ease(flap); ctx.shadowOffsetY = 16 + 26 * ease(flap);
  const SL = 6;
  for (let x = 0; x < PW; x += SL) {
    const k = Math.pow(x / PW, 1.6);
    const dy = wave * Math.sin(x / 95 - t * 10) * k - lift * k;
    ctx.drawImage(OCT_C, x, 0, SL, PH, x, dy, SL + 0.6, PH);
    if (x === 0) { ctx.shadowColor = 'transparent'; }
    // light and shade across the ripples
    const slope = Math.cos(x / 95 - t * 10) * k * (wave / 26);
    ctx.fillStyle = slope > 0 ? `rgba(255,255,255,${0.12 * slope})` : `rgba(80,60,40,${-0.1 * slope})`;
    ctx.fillRect(x, dy, SL + 0.6, PH);
  }
  ctx.restore();
}
function gust(t) {
  const a = seg(t, 1.7, 2.0) * (1 - seg(t, 3.6, 4.2));
  if (a <= 0) return;
  ctx.save(); ctx.lineCap = 'round';
  for (let k = 0; k < 7; k++) {
    const y = 980 + rnd(k) * 700, len = 160 + rnd(k + 9) * 220, sp = 1500 + rnd(k + 3) * 600;
    const x = ((t - 1.7) * sp + rnd(k + 5) * 1400) % 1700 - 300;
    ctx.strokeStyle = `rgba(160,150,135,${0.35 * a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + len * 0.5, y - 18, x + len, y - 4);
    if (k % 3 === 0) ctx.arc(x + len, y - 24, 20, Math.PI / 2, Math.PI * 1.7, true);
    ctx.stroke();
  }
  // autumn leaves riding the gust
  const cols = ['#C97A4A', '#D9A15E', '#8F9C88', '#A8582E', '#E3B76B'];
  for (let k = 0; k < 6; k++) {
    const p = seg(t, 1.8 + k * 0.12, 3.6 + k * 0.12); if (p <= 0 || p >= 1) continue;
    const x = -60 + p * 1250, y = 1500 - rnd(k) * 520 - p * 380 + Math.sin(p * 9 + k) * 40;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (4 + k) + k); ctx.scale(1, 0.55 + 0.45 * Math.sin(t * 8 + k));
    ctx.fillStyle = cols[k % 5]; ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(14, -4, 0, 18); ctx.quadraticCurveTo(-14, -4, 0, -18); ctx.fill();
    ctx.strokeStyle = 'rgba(90,50,20,.4)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 22); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ---------- frame ----------
let built = false;
function render(t) {
  if (!built) { card(OCT_C.getContext('2d'), OCT); card(NOV_C.getContext('2d'), NOV); built = true; }
  backdrop(t);
  // heading; "save your spot" flickers on like a sign
  const ha = ease(seg(t, 0.1, 0.9));
  text(ctx, 'THIS WEEK + NOVEMBER', 540, 150, '500 30px Poppins', C.terra, { sp: 9, alpha: ha });
  const pattern = [1, 0, 1, 1, 0, 0, 1, 0, 1, 1];
  let on = 0;
  if (t >= 6.4) on = t < 7.4 ? pattern[Math.floor((t - 6.4) / 0.1)] : 1;
  ctx.save();
  if (on) { ctx.shadowColor = 'rgba(242,168,96,0.9)'; ctx.shadowBlur = 26 + 6 * Math.sin(t * 9); }
  text(ctx, 'save your spot', 540, 262, 'italic 500 92px Lora', on ? '#B8743F' : '#5D625B', { alpha: ha * (t >= 6.4 && !on ? 0.35 : 1) });
  ctx.restore();

  // calendar rises in; November waits underneath October
  const up = eOut(seg(t, 0.3, 1.3));
  ctx.save(); ctx.globalAlpha = up; ctx.translate(0, (1 - up) * 80);
  ctx.save(); ctx.globalAlpha *= 0.92;
  ctx.shadowColor = 'rgba(60,50,30,0.22)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 18;
  if (t > 1.9) ctx.drawImage(NOV_C, PX, PY);
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= 0.92;
  if (t <= 1.9) { ctx.shadowColor = 'rgba(60,50,30,0.22)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 18; ctx.drawImage(OCT_C, PX, PY); }
  else octoberInWind(t);
  ctx.restore();
  ctx.restore();
  gust(t);

  // CTA
  const ca = ease(seg(t, 7.5, 8.1));
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca; ctx.fillStyle = C.band; rr(ctx, 540 - 230, 1712 + (1 - ca) * 20, 460, 92, 46); ctx.fill(); ctx.restore();
    text(ctx, 'book · link in bio', 540, 1770 + (1 - ca) * 20, '500 36px Poppins', '#F6F3EC', { sp: 2, alpha: ca });
  }
}

window.render = render; window.DURATION = DURATION;
Promise.all([document.fonts.load('500 20px Poppins'), document.fonts.load('italic 500 20px Lora'), document.fonts.load('600 20px Lora')])
  .then(() => { render(0); window.ready = true; });
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { if (window.ready) render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
</body></html>
