<!-- The sign-in email. {{ .Token }} is the 6-digit code; do not use links. -->
<div style="font-family: Georgia, 'Times New Roman', serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #4a5148; background: #f4f2ec;">
  <p style="font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #b5714f; margin: 0 0 4px;">Gilbert Flex Studio</p>
  <h1 style="font-size: 26px; font-style: italic; font-weight: normal; margin: 0 0 16px;">Your sign-in code</h1>
  <p style="font-size: 38px; letter-spacing: 8px; margin: 12px 0 18px; color: #5c645a;"><strong>{{ .Token }}</strong></p>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 8px;">Type this code into the Gilbert Flex Club app to sign in. It works once and expires in an hour.</p>
  <p style="font-size: 13px; line-height: 1.5; color: #8a9186; margin: 16px 0 0;">Didn't ask for this? You can ignore this email. No one can get in without the code.</p>
</div>
