<html lang="en"><head><meta charset="utf-8">

<title>Studio desk · Gilbert Flex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500&family=Poppins:wght@300;400;500&display=swap">
<style>
:root{--bg:#F6F3EC;--card:#FBF9F4;--card2:#F1ECE2;--line:#E2DCD1;--ink:#5D625B;--deep:#3E443E;--muted:#7A7E77;--clay:#A8714F;--sage:#B9C2B2;--blush:#EBD9CB;--onink:#FBF9F4;--bad:#9a4b3a;

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--deep);font:15px/1.55 var(--sans)}
.wrap{max-width:880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
h1{margin:0;font:italic 500 30px/1.1 var(--serif);color:var(--ink)}
h2{margin:0 0 8px;font:italic 500 22px/1.2 var(--serif);color:var(--ink)}
h3{margin:0;font-weight:500;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.who{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--deep);border-radius:999px;padding:8px 14px;font:500 13px var(--sans);cursor:pointer}

.sp{flex:1}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--onink);border:0;border-radius:999px;padding:10px 16px;font:500 14px var(--sans);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}

.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

.chip.new{background:var(--blush);color:var(--clay)}.chip.published,.chip.done,.chip.approved,.chip.posted{background:var(--sage);color:var(--deep)}.chip.rejected,.chip.spam{background:var(--blush);color:var(--bad)}

label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:400}
label.inline input{width:auto}
input,textarea,select{font:400 15px var(--sans);color:var(--deep);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical}

dl{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:14px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}

.center{max-width:420px;margin:12vh auto 0}
</style></head>

/* ---------- inbox ---------- */
var inboxFilter={status:"new"};

    h("div",{class:"row"},h("h3",{text:l.name}),h("span",{class:"chip "+l.status,text:l.status}),h("span",{class:"chip",text:KIND[l.kind]||l.kind}),l.event_title?h("span",{class:"chip",text:l.event_title}):null,l.source?h("span",{class:"chip",text:"from "+l.source}):null,h("span",{class:"sp"}),h("span",{class:"muted",text:niceDate(l.created_at)})),

/* ---------- events ---------- */

    put(main,h("div",{class:"row",style:"margin-bottom:10px"},h("h2",{text:"events"}),h("span",{class:"sp"}),h("button",{class:"btn small",onclick:function(){eventForm(main,null)},text:"new event"})),

    h("div",{class:"row"},h("h3",{text:e.title}),h("span",{class:"chip "+(e.published?"published":""),text:e.published?"published":"hidden"}),h("span",{class:"sp"}),h("span",{class:"muted",text:niceDate(e.starts_at)})),

    h("div",{class:"row"},h("button",{class:"btn ghost small",onclick:function(){eventForm(main,e)},text:"edit"}),h("button",{class:"btn ghost small",onclick:function(){signups(main,e)},text:"sign-ups"}),

}

    ev.preventDefault();var q=f.elements,btn=f.querySelector("button[type=submit]");btn.disabled=true;

    h("label",{},"title",h("input",{name:"title",required:true,maxlength:"80",value:e.title||""})),
    h("div",{class:"grid2"},h("label",{},"starts (Gilbert time)",h("input",{name:"starts",type:"datetime-local",required:true,value:phxLocal(e.starts_at)})),h("label",{},"ends (optional)",h("input",{name:"ends",type:"datetime-local",value:phxLocal(e.ends_at)}))),
    h("div",{class:"grid2"},h("label",{},"price",h("input",{name:"price",maxlength:"40",placeholder:"$25",value:e.price||""})),h("label",{},"spots (blank = no limit)",h("input",{name:"spots",type:"number",min:"1",max:"500",value:e.spots||""}))),
    h("div",{class:"grid2"},h("label",{},"host",h("input",{name:"host",maxlength:"60",value:e.host||""})),h("label",{},"where",h("input",{name:"location",maxlength:"120",placeholder:"Gilbert Flex Studio",value:e.location&&e.location!=="Gilbert Flex Studio"?e.location:""}))),

    h("label",{},"about it",h("textarea",{name:"blurb",maxlength:"600"},e.blurb||"")),
    h("label",{class:"inline"},h("input",{name:"published",type:"checkbox",checked:!!e.published}),"show on the public calendar"),
    h("div",{class:"row"},h("button",{class:"btn",type:"submit",text:"save"}),h("button",{class:"btn ghost",type:"button",onclick:function(){VIEW.events(main)},text:"cancel"})));

    list=list||[];
    put(main,h("div",{class:"row",style:"margin-bottom:10px"},h("button",{class:"btn ghost small",onclick:function(){VIEW.events(main)},text:"‹ events"}),h("h2",{style:"margin:0",text:e.title})),
