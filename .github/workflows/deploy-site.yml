name: Deploy site to Cloudflare

# Publishes public/ to the Cloudflare Worker named in wrangler.jsonc
# (gilbert-flex-studio). Runs on every push to main that touches the site,
# or by hand from the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID

on:
  push:
    branches: [main]
    paths: ['public/**', 'wrangler.jsonc', 'package.json', 'package-lock.json', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check Cloudflare secrets are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          ok=true
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing. Add it under Settings > Secrets and variables > Actions > Secrets tab > New repository secret (not Variables, not Environments)."; ok=false; fi
          if [ "$HAS_ACCOUNT" != "true" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add it as a repository secret (or variable) under Settings > Secrets and variables > Actions."; ok=false; fi
          $ok
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
